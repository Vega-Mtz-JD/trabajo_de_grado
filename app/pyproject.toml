[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "votoseguro"
version = "0.1.0"
description = "Sistema de votación electrónica offline con blockchain para auditoría y verificación multinivel"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "Diego" }]
dependencies = [
    "cryptography>=43",
    "argon2-cffi>=23",
    "psycopg[binary]>=3.2",
    "segno>=1.6",
    "reportlab>=4",
    "requests>=2.32",
]

[project.optional-dependencies]
ui = ["PySide6>=6.7"]
hardware = ["python-escpos>=3.1"]
docs = ["python-docx>=1.1"]
dev = ["pytest>=8", "pytest-cov>=5", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
votoseguro = "votoseguro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"votoseguro.datos" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["bd: pruebas que usan una instancia temporal de PostgreSQL"]
